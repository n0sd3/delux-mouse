[package]
name = "delux-cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "delux"
path = "src/main.rs"

[dependencies]
delux-proto = { path = "../delux-proto" }
delux-hid = { path = "../delux-hid" }
delux-core = { path = "../delux-core" }
delux-profile = { path = "../delux-profile" }
clap = { version = "4", features = ["derive"] }
